name: CI

on:
  push:
    branches: [main, starter]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # Spins up real Postgres, Qdrant, and Redis containers and verifies the app
  # can migrate the schema, sync embeddings into Qdrant, and pass /api/health
  # against actual services (not the local fallbacks).
  integration:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aspire
          POSTGRES_PASSWORD: aspire
          POSTGRES_DB: aspire
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aspire"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:latest
        ports: ["6333:6333"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://aspire:aspire@localhost:5432/aspire
      QDRANT_URL: http://localhost:6333
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync embeddings into Qdrant
        run: node scripts/sync-qdrant.mjs

      - name: Build
        run: npm run build

      - name: Boot app and check /api/health
        run: |
          npm run start &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > health.json; then
              cat health.json
              # Fail if any layer fell back instead of using the real service.
              grep -q '"database":"postgres"' health.json
              grep -q '"vectorStore":"qdrant"' health.json
              grep -q '"cache":"redis"' health.json
              exit 0
            fi
            sleep 2
          done
          echo "app never became healthy" && exit 1
